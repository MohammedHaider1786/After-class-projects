<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bank App – Income & Expense Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 20px;
            width: 350px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
        }

        .balance {
            text-align: center;
            font-size: 20px;
            margin-bottom: 15px;
        }

        input, select, button {
            width: 100%;
            padding: 8px;
            margin: 6px 0;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 10px;
        }

        li {
            padding: 6px;
            margin-bottom: 5px;
            border-radius: 4px;
            font-size: 14px;
        }

        .income {
            background: #d4edda;
            color: #155724;
        }

        .expense {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Bank App</h2>

    <div class="balance">
        Balance: Rs <span id="balance">0</span>
    </div>

    <input type="text" id="description" placeholder="Description">
    <input type="number" id="amount" placeholder="Amount">

    <select id="type">
        <option value="income">Income</option>
        <option value="expense">Expense</option>
    </select>

    <button onclick="addTransaction()">Add Transaction</button>

    <ul id="transactions"></ul>
</div>

<script>
    let balance = 0;

    function addTransaction() {
        let desc = document.getElementById("description").value;
        let amount = Number(document.getElementById("amount").value);
        let type = document.getElementById("type").value;

        if (desc === "" || amount === 0) {
            alert("Please enter valid details");
            return;
        }

        if (type === "expense" && amount > balance) {
            alert("Insufficient balance!");
            return;
        }

        let li = document.createElement("li");

        if (type === "income") {
            balance += amount;
            li.className = "income";
            li.textContent = `Income: +Rs ${amount} (${desc})`;
        } else {
            balance -= amount;
            li.className = "expense";
            li.textContent = `Expense: -Rs ${amount} (${desc})`;
        }

        document.getElementById("transactions").appendChild(li);
        document.getElementById("balance").textContent = balance;

        document.getElementById("description").value = "";
        document.getElementById("amount").value = "";
    }
</script>

</body>
</html>
