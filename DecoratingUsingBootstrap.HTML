<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bootstrap Typography</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

    <h1 class="text-primary">Bootstrap Typography</h1>

    <p class="lead">
        This is a lead paragraph using Bootstrap.
    </p>

    <p class="text-success">
        This text is green using Bootstrap.
    </p>

    <p class="fw-bold">
        This text is bold.
    </p>

    <p class="fst-italic">
        This text is italic.
    </p>

    <button class="btn btn-danger">
        Bootstrap Button
    </button>

</body>
</html>
